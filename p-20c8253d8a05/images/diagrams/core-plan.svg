<path d="M788.0,1480 L788,1512" class="edge" marker-end="url(#a)"/>
<g class="node diamond" data-cx="788" data-cy="1560" data-w="224" data-h="96"><polygon points="788,1512.0 900.0,1560 788,1608.0 676.0,1560" class="dec"/>
<text x="788" y="1556" class="h" text-anchor="middle">Upload</text>
<text x="788" y="1574" class="h" text-anchor="middle">fits?</text>
</g>
<path d="M900,1560 L1144,1560 L1144,1432.0 L1068.0,1432.0" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="916" y="1552" class="lbl" text-anchor="start">no: fewer layers, again</text>
</g>
<g class="free">
<text x="916" y="1584" class="note" text-anchor="start">upload_fitting: out of memory;</text>
<text x="916" y="1600" class="note" text-anchor="start">a GPU lacking a weight type or</text>
<text x="916" y="1616" class="note" text-anchor="start">the architecture: the next one</text>
<text x="916" y="1632" class="note" text-anchor="start">(try_each)</text>
</g>
<g class="node"><rect x="508.0" y="1648" width="560" height="80" rx="8" class="gpu"/>
<text x="788" y="1675.5" class="h" text-anchor="middle">The RAM the GPU took goes to the CPU's experts</text>
<text x="788" y="1693.5" class="b" text-anchor="middle">the memory plan made again</text>
<text x="788" y="1710.5" class="c" text-anchor="middle">Engine::plan_after_gpu · Plan::after_gpu</text>
</g>
<path d="M788,1608 L788.0,1648" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="796" y="1632" class="lbl" text-anchor="start">yes</text>
</g>
<g class="node"><rect x="240.0" y="1808" width="720" height="80" rx="8" class="term"/>
<text x="600" y="1835.5" class="h" text-anchor="middle">The placement map, printed before the first token</text>
<text x="600" y="1853.5" class="b" text-anchor="middle">GPU: its layers, their KV cache, the output layer; CPU: the rest</text>
<text x="600" y="1870.5" class="c" text-anchor="middle">placement::of_model · map.to_text</text>
</g>
<path d="M224.0,1480 L224.0,1776" class="edge"/>
<path d="M788.0,1728 L788.0,1776" class="edge"/>
<path d="M224.0,1776 L788.0,1776" class="edge"/>
