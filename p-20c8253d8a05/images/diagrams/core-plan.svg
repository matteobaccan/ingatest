<text x="32" y="160" class="sec" text-anchor="start">1. One machine or several</text>
<path d="M32,172 L1168,172" class="rule"/>
<g class="node"><rect x="400.0" y="192" width="400" height="40" rx="20.0" class="term"/>
<text x="600" y="217" class="h" text-anchor="middle">A loaded GgufFile and its ModelSpec</text>
</g>
<path d="M600.0,232 L600,256" class="edge" marker-end="url(#a)"/>
<g class="node diamond" data-cx="600" data-cy="304" data-w="256" data-h="96"><polygon points="600,256.0 728.0,304 600,352.0 472.0,304" class="dec"/>
<text x="600" y="300" class="h" text-anchor="middle">Other machines</text>
<text x="600" y="318" class="h" text-anchor="middle">asked for?</text>
</g>
<g class="free">
<text x="448" y="296" class="note" text-anchor="end">load_engine_only</text>
<text x="448" y="312" class="note" text-anchor="end">src/commands/mod.rs</text>
</g>
<g class="node"><rect x="864.0" y="232" width="304" height="128" rx="8" class="net"/>
<text x="1016" y="258.0" class="h" text-anchor="middle">Other machines run parts</text>
<text x="1016" y="276.0" class="b" text-anchor="middle">layers (--nodes), experts (--expert-nodes)</text>
<text x="1016" y="293.0" class="b" text-anchor="middle">or tensor slices (--tp-nodes); a mesh's</text>
<text x="1016" y="310.0" class="b" text-anchor="middle">satellites, a prompt read by a prefill node;</text>
<text x="1016" y="327.0" class="b" text-anchor="middle">no GPU layers with these yet</text>
<text x="1016" y="344.0" class="c" text-anchor="middle">plan_pipeline · mesh::load · inga-dist</text>
</g>
<path d="M728,304 L864.0,304" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="744" y="296" class="lbl" text-anchor="start">yes</text>
</g>
<text x="32" y="408" class="sec" text-anchor="start">2. The memory plan</text>
<path d="M32,420 L1168,420" class="rule"/>
<g class="node"><rect x="300.0" y="448" width="600" height="96" rx="8" class="step"/>
<text x="600" y="475.0" class="h" text-anchor="middle">Budget: the RAM available, capped by --mem-limit</text>
<text x="600" y="493.0" class="b" text-anchor="middle">optional first: the experts converted or striped over disks</text>
<text x="600" y="510.0" class="b" text-anchor="middle">(--quantize-experts, --experts-precision, --experts-dir)</text>
<text x="600" y="527.0" class="c" text-anchor="middle">Engine::prepare (crates/inga-engine/src/session.rs)</text>
</g>
<path d="M600,352 L600.0,448" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="608" y="384" class="lbl" text-anchor="start">no</text>
</g>
<g class="node"><rect x="300.0" y="584" width="600" height="64" rx="8" class="step"/>
<text x="600" y="612.5" class="h" text-anchor="middle">Need: resident weights + KV cache for --ctx + overhead</text>
<text x="600" y="629.5" class="c" text-anchor="middle">Plan::new (crates/inga-engine/src/plan.rs)</text>
</g>
<path d="M600.0,544 L600.0,584" class="edge" marker-end="url(#a)"/>
<path d="M600.0,648 L600,680" class="edge" marker-end="url(#a)"/>
<g class="node diamond" data-cx="600" data-cy="728" data-w="256" data-h="96"><polygon points="600,680.0 728.0,728 600,776.0 472.0,728" class="dec"/>
<text x="600" y="724" class="h" text-anchor="middle">Does it fit</text>
<text x="600" y="742" class="h" text-anchor="middle">the budget?</text>
</g>
<g class="free">
<text x="752" y="720" class="note" text-anchor="start">Plan::planned</text>
<text x="752" y="736" class="note" text-anchor="start">ExpertTier</text>
</g>
<path d="M600,776 L600,792" class="edge"/>
<path d="M224,792 L976,792" class="edge"/>
<path d="M224,792 L224,824" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="232" y="814" class="lbl" text-anchor="start">yes</text>
</g>
<path d="M600,792 L600,824" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="608" y="814" class="lbl" text-anchor="start">no, a mixture of experts</text>
</g>
<path d="M976,792 L976,824" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="984" y="814" class="lbl" text-anchor="start">no, otherwise</text>
</g>
<g class="node"><rect x="48.0" y="824" width="352" height="128" rx="8" class="cpu"/>
<text x="224" y="867.0" class="h" text-anchor="middle">Everything in RAM</text>
<text x="224" y="885.0" class="b" text-anchor="middle">memory-mapped from the file</text>
<text x="224" y="902.0" class="b" text-anchor="middle">(ExpertTier::Ram for experts)</text>
<text x="224" y="919.0" class="c" text-anchor="middle">Plan { fits: true }</text>
</g>
<g class="node"><rect x="424.0" y="824" width="352" height="128" rx="8" class="disk"/>
<text x="600" y="850.0" class="h" text-anchor="middle">Experts streamed from disk</text>
<text x="600" y="868.0" class="b" text-anchor="middle">a cache of at least n_expert_used experts,</text>
<text x="600" y="885.0" class="b" text-anchor="middle">positioned reads, evicted by LFRU;</text>
<text x="600" y="902.0" class="b" text-anchor="middle">--prerouter reads ahead, --pin-experts</text>
<text x="600" y="919.0" class="b" text-anchor="middle">keeps the hot ones of earlier runs</text>
<text x="600" y="936.0" class="c" text-anchor="middle">ExpertTier::Disk · experts.rs</text>
</g>
<g class="node"><rect x="800.0" y="824" width="352" height="128" rx="8" class="disk"/>
<text x="976" y="850.0" class="h" text-anchor="middle">Layers streamed from disk</text>
<text x="976" y="868.0" class="b" text-anchor="middle">the next layer's mapping advised</text>
<text x="976" y="885.0" class="b" text-anchor="middle">WILLNEED, the current one DONTNEED;</text>
<text x="976" y="902.0" class="b" text-anchor="middle">the embeddings and the output layer</text>
<text x="976" y="919.0" class="b" text-anchor="middle">stay resident</text>
<text x="976" y="936.0" class="c" text-anchor="middle">Plan::stream_layers</text>
</g>
<text x="32" y="1032" class="sec" text-anchor="start">3. The device</text>
<path d="M32,1044 L1168,1044" class="rule"/>
<path d="M224.0,952 L224.0,1000" class="edge"/>
<path d="M600.0,952 L600.0,1000" class="edge"/>
