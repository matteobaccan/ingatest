<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2160" viewBox="0 0 1200 2160" role="img" aria-labelledby="title desc">
<title id="title">Where the model runs: the memory and device plan</title>
<desc id="desc">Flowchart: other machines (pipeline, experts, tensor parallelism, mesh), the memory budget and plan (everything in RAM, experts streamed from disk, layers streamed), the GPU choice (CPU only, CUDA then Metal then Vulkan, named devices), fitting layers on the GPU and the KV cache types and places.</desc>
<!-- A diagram of docs/architecture-flow.md, kept by hand: every branch names the file
     and the function that takes the decision; change them together. -->
