<text x="32" y="44" class="t1" text-anchor="start">Where the model runs: the memory and device plan</text>
<text x="32" y="70" class="t2" text-anchor="start">After the load: other machines, the memory plan, the GPU and the KV cache, as load_engine_only (src/commands/mod.rs) runs them in order</text>
