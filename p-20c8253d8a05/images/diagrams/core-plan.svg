<text x="600" y="1125" class="h" text-anchor="middle">Which GPU?</text>
</g>
<g class="free">
<text x="752" y="1112" class="note" text-anchor="start">candidates</text>
<text x="752" y="1128" class="note" text-anchor="start">crates/inga-engine/src/device.rs</text>
</g>
<path d="M600,1168 L600,1184" class="edge"/>
<path d="M224,1184 L976,1184" class="edge"/>
<path d="M224,1184 L224,1216" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="232" y="1206" class="lbl" text-anchor="start">--device cpu, --gpu-layers 0</text>
</g>
<path d="M600,1184 L600,1216" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="608" y="1206" class="lbl" text-anchor="start">auto, the default</text>
</g>
<path d="M976,1184 L976,1216" class="edge" marker-end="url(#a)"/>
<g class="free">
<text x="984" y="1206" class="lbl" text-anchor="start">--device NAME or a list</text>
</g>
<g class="node"><rect x="48.0" y="1216" width="352" height="112" rx="8" class="cpu"/>
<text x="224" y="1242.5" class="h" text-anchor="middle">CPU only</text>
<text x="224" y="1260.5" class="b" text-anchor="middle">also when an option needs it (--image,</text>
<text x="224" y="1277.5" class="b" text-anchor="middle">--collect-imatrix, --control-vector...)</text>
<text x="224" y="1294.5" class="b" text-anchor="middle">or when no GPU is found</text>
<text x="224" y="1311.5" class="c" text-anchor="middle">cpu_only_why · gpu_lines</text>
</g>
<g class="node"><rect x="424.0" y="1216" width="352" height="112" rx="8" class="gpu"/>
<text x="600" y="1242.5" class="h" text-anchor="middle">The best GPU first</text>
<text x="600" y="1260.5" class="b" text-anchor="middle">CUDA, then Metal, then Vulkan; discrete</text>
<text x="600" y="1277.5" class="b" text-anchor="middle">first, the most free memory first; an</text>
<text x="600" y="1294.5" class="b" text-anchor="middle">integrated GPU only alone; HIP only named</text>
<text x="600" y="1311.5" class="c" text-anchor="middle">candidates (DeviceSel::Auto)</text>
</g>
<g class="node"><rect x="800.0" y="1216" width="352" height="112" rx="8" class="gpu"/>
<text x="976" y="1242.5" class="h" text-anchor="middle">The GPUs named</text>
<text x="976" y="1260.5" class="b" text-anchor="middle">that device only, or the layers split</text>
<text x="976" y="1277.5" class="b" text-anchor="middle">across the GPUs of the list</text>
<text x="976" y="1294.5" class="b" text-anchor="middle">(--gpu-split)</text>
<text x="976" y="1311.5" class="c" text-anchor="middle">DeviceSel::Split · attach_split</text>
</g>
<g class="node"><rect x="48.0" y="1384" width="352" height="96" rx="8" class="cpu"/>
<text x="224" y="1411.0" class="h" text-anchor="middle">Weights repacked for the CPU</text>
<text x="224" y="1429.0" class="b" text-anchor="middle">rows in groups of eight for its kernels;</text>
<text x="224" y="1446.0" class="b" text-anchor="middle">--no-repack keeps them as stored</text>
<text x="224" y="1463.0" class="c" text-anchor="middle">Engine::repack · inga-cpu/src/repack.rs</text>
</g>
<path d="M224.0,1328 L224.0,1384" class="edge" marker-end="url(#a)"/>
<g class="node"><rect x="508.0" y="1384" width="560" height="96" rx="8" class="gpu"/>
<text x="788" y="1411.0" class="h" text-anchor="middle">Fit: the last layers first</text>
<text x="788" y="1429.0" class="b" text-anchor="middle">the output layer once every layer fits; routed experts</text>
<text x="788" y="1446.0" class="b" text-anchor="middle">from the last layer back (--experts-on, --cpu-moe)</text>
<text x="788" y="1463.0" class="c" text-anchor="middle">fit_with · place_experts (src/commands/placement.rs)</text>
</g>
<path d="M600.0,1328 L600.0,1360" class="edge"/>
<path d="M976.0,1328 L976.0,1360" class="edge"/>
<path d="M600.0,1360 L976.0,1360" class="edge"/>
