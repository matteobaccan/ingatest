<text x="32" y="1928" class="sec" text-anchor="start">4. The KV cache</text>
<path d="M32,1940 L1168,1940" class="rule"/>
<g class="node"><rect x="48.0" y="1968" width="352" height="112" rx="8" class="step"/>
<text x="224" y="2003.0" class="h" text-anchor="middle">Its type</text>
<text x="224" y="2021.0" class="b" text-anchor="middle">f16 by default; q8_0, q4_0, q5_0 or</text>
<text x="224" y="2038.0" class="b" text-anchor="middle">q4_K with --cache-type</text>
<text x="224" y="2055.0" class="c" text-anchor="middle">inga_core::KvType</text>
</g>
<g class="node"><rect x="424.0" y="1968" width="352" height="112" rx="8" class="step"/>
<text x="600" y="1994.5" class="h" text-anchor="middle">Its place</text>
<text x="600" y="2012.5" class="b" text-anchor="middle">on the device of its layer; in inga serve</text>
<text x="600" y="2029.5" class="b" text-anchor="middle">one prefix cache for the sessions, its pages</text>
<text x="600" y="2046.5" class="b" text-anchor="middle">shared with --kv-pages</text>
<text x="600" y="2063.5" class="c" text-anchor="middle">inga-server/src/pool.rs</text>
</g>
<g class="node"><rect x="800.0" y="1968" width="352" height="112" rx="8" class="disk"/>
<text x="976" y="1994.5" class="h" text-anchor="middle">On disk</text>
<text x="976" y="2012.5" class="b" text-anchor="middle">--kv-ram: the older blocks on disk;</text>
<text x="976" y="2029.5" class="b" text-anchor="middle">--kv-disk: the prefix cache's copies and</text>
<text x="976" y="2046.5" class="b" text-anchor="middle">the parked conversations</text>
<text x="976" y="2063.5" class="c" text-anchor="middle">inga-engine/src/kv_disk.rs</text>
</g>
<text x="32" y="2128" class="t2" text-anchor="start">Next: one token on the CPU (core-token.svg).</text>
</svg>
