<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1712" viewBox="0 0 1200 1712" role="img" aria-labelledby="title desc">
<title id="title">From a model reference to a loaded model</title>
<desc id="desc">Flowchart: how Inga resolves a model reference (Ollama, Hugging Face or ModelScope, a cache folder, a path), opens its format (safetensors folder or file, Whisper ggml, GGUF) and recognises its kind (image, speech, projector, encoder, unsupported, language model) and the families of its layers.</desc>
<!-- A diagram of docs/architecture-flow.md, kept by hand: every branch names the file
     and the function that takes the decision; change them together. -->
