<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="ia-title">
  <title id="ia-title">Inga - Neural Inference Engine (Dynamic Animation)</title>
  <!-- Inga: Modern Neural Architecture in Motion.
       Staggered cognitive lobe expansion with magnetic snap-back and token generation pulse.
       Supports Light/Dark themes and prefers-reduced-motion. -->
  <defs>
    <style>
      :root {
        --cycle: 5s;
      }

      /* Core Container Breathing */
      .ia-brain-rig {
        transform-origin: 256px 256px;
        animation: ia-rig-breathe var(--cycle) ease-in-out infinite;
      }
      @keyframes ia-rig-breathe {
        0%, 100% { transform: scale(1); }
        16% { transform: scale(1.018); }
        26% { transform: scale(0.975); } /* Pre-burst contraction */
        40% { transform: scale(1.03); }  /* Burst expansion */
        56% { transform: scale(1.01); }  /* Floating compute state */
        74% { transform: scale(0.985); } /* Snap contraction */
        82% { transform: scale(1.008); } /* Lock-in rebound */
      }

      /* --- LEFT HEMISPHERE: STAGGERED MOTION --- */
      /* Top Frontal Lobe: Leads thought (fastest snap) */
      .ia-lt {
        transform-origin: 245px 166px;
        animation: ia-lt-anim var(--cycle) cubic-bezier(0.16, 1.25, 0.38, 1) infinite;
      }
      @keyframes ia-lt-anim {
        0%, 26%, 86%, 100% { transform: none; }
        38%, 64% { transform: translate(-38px, -32px) rotate(-11deg); }
        50% { transform: translate(-41px, -34px) rotate(-12.5deg); } /* Subtle hover float */
        76% { transform: translate(2px, 1px) rotate(0.8deg); }       /* Rebound overshoot */
      }

      /* Middle Temporal-Parietal Lobe: Follows with lateral burst */
      .ia-lm {
        transform-origin: 174px 244px;
        animation: ia-lm-anim var(--cycle) cubic-bezier(0.16, 1.25, 0.38, 1) infinite;
      }
      @keyframes ia-lm-anim {
        0%, 28%, 86%, 100% { transform: none; }
        40%, 64% { transform: translate(-48px, 1px) rotate(-4.5deg); }
        52% { transform: translate(-51px, 2px) rotate(-5.5deg); }
        77% { transform: translate(3px, 0px) rotate(0.6deg); }
      }

      /* Bottom Cerebellar Lobe: Anchor and stability */
      .ia-lb {
        transform-origin: 176px 336px;
        animation: ia-lb-anim var(--cycle) cubic-bezier(0.16, 1.25, 0.38, 1) infinite;
      }
      @keyframes ia-lb-anim {
        0%, 30%, 86%, 100% { transform: none; }
        42%, 64% { transform: translate(-36px, 34px) rotate(9.5deg); }
        54% { transform: translate(-39px, 37px) rotate(11deg); }
        78% { transform: translate(2px, -2px) rotate(-0.7deg); }
      }

      /* --- RIGHT HEMISPHERE: STAGGERED MOTION (MIRRORED) --- */
      .ia-rt {
        transform-origin: 267px 166px;
        animation: ia-rt-anim var(--cycle) cubic-bezier(0.16, 1.25, 0.38, 1) infinite;
      }
      @keyframes ia-rt-anim {
        0%, 26%, 86%, 100% { transform: none; }
        38%, 64% { transform: translate(38px, -32px) rotate(11deg); }
        50% { transform: translate(41px, -34px) rotate(12.5deg); }
        76% { transform: translate(-2px, 1px) rotate(-0.8deg); }
      }

      .ia-rm {
        transform-origin: 338px 244px;
        animation: ia-rm-anim var(--cycle) cubic-bezier(0.16, 1.25, 0.38, 1) infinite;
      }
      @keyframes ia-rm-anim {
        0%, 28%, 86%, 100% { transform: none; }
        40%, 64% { transform: translate(48px, 1px) rotate(4.5deg); }
        52% { transform: translate(51px, 2px) rotate(5.5deg); }
        77% { transform: translate(-3px, 0px) rotate(-0.6deg); }
      }

      .ia-rb {
        transform-origin: 336px 336px;
        animation: ia-rb-anim var(--cycle) cubic-bezier(0.16, 1.25, 0.38, 1) infinite;
      }
      @keyframes ia-rb-anim {
        0%, 30%, 86%, 100% { transform: none; }
        42%, 64% { transform: translate(36px, 34px) rotate(-9.5deg); }
        54% { transform: translate(39px, 37px) rotate(-11deg); }
        78% { transform: translate(-2px, -2px) rotate(0.7deg); }
      }

      /* Neural Core Synaptic Pulse (Tokens Flowing during compute) */
      .token-core {
        opacity: 0;
        transform-origin: 256px 256px;
        animation: ia-token-pulse var(--cycle) ease-out infinite;
      }
      @keyframes ia-token-pulse {
        0%, 30% { opacity: 0; transform: scale(0.2); }
        36% { opacity: 0.95; transform: scale(0.9); }
        52% { opacity: 0.85; transform: scale(1.15) rotate(12deg); }
        66% { opacity: 0.4; transform: scale(1.3) rotate(20deg); }
        76%, 100% { opacity: 0; transform: scale(0.5); }
      }

      /* Synaptic Beam Connectors (Elastic Inter-Lobe Beams) */
      .synapse-beam {
        stroke-dasharray: 4 6;
        stroke-linecap: round;
        opacity: 0;
        animation: ia-synapse-flow var(--cycle) ease-in-out infinite;
      }
      @keyframes ia-synapse-flow {
        0%, 32% { opacity: 0; stroke-dashoffset: 0; }
        40% { opacity: 0.85; }
        62% { opacity: 0.75; stroke-dashoffset: -28; }
        72%, 100% { opacity: 0; }
      }

      /* Theme Tokens */
      .bg { fill: #0F0F13; }
      .border-line { stroke: #272732; stroke-width: 2.5; fill: none; }
      .lt-col { fill: #818CF8; }
      .lm-col { fill: #6366F1; }
      .lb-col { fill: #4F46E5; }
      .beam-col { stroke: #A5B4FC; stroke-width: 2.5; }
      .particle-1 { fill: #EEF2FF; }
      .particle-2 { fill: #C7D2FE; }
      .particle-3 { fill: #818CF8; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #FFFFFF; }
        .border-line { stroke: #E2E2E8; stroke-width: 2.5; }
        .lt-col { fill: #6366F1; }
        .lm-col { fill: #4F46E5; }
        .lb-col { fill: #3730A3; }
        .beam-col { stroke: #4F46E5; stroke-width: 2.5; }
        .particle-1 { fill: #4338CA; }
        .particle-2 { fill: #4F46E5; }
        .particle-3 { fill: #6366F1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ia-brain-rig, .ia-lt, .ia-lm, .ia-lb, .ia-rt, .ia-rm, .ia-rb, .token-core, .synapse-beam {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Architectural Card Foundation -->
  <rect x="16" y="16" width="480" height="480" rx="96" class="bg"/>
  <rect x="16" y="16" width="480" height="480" rx="96" class="border-line"/>

  <!-- Main Animation Rig -->
  <g class="ia-brain-rig">
    <!-- Active Synaptic Energy Streams (visible while lobes expand) -->
    <g class="synapse-beam beam-col">
      <line x1="220" y1="160" x2="292" y2="160"/>
      <line x1="205" y1="240" x2="307" y2="240"/>
      <line x1="216" y1="324" x2="296" y2="324"/>
      <line x1="220" y1="190" x2="292" y2="290"/>
      <line x1="220" y1="290" x2="292" y2="190"/>
    </g>

    <!-- Center Inference Token Burst -->
    <g class="token-core">
      <!-- High-energy computational core tokens -->
      <circle cx="256" cy="256" r="6" class="particle-1"/>
      <circle cx="228" cy="216" r="4.5" class="particle-2"/>
      <circle cx="284" cy="216" r="4.5" class="particle-2"/>
      <circle cx="214" cy="276" r="5" class="particle-3"/>
      <circle cx="298" cy="276" r="5" class="particle-3"/>
      <circle cx="256" cy="316" r="4.5" class="particle-2"/>
      <circle cx="256" cy="192" r="4.5" class="particle-1"/>
      <circle cx="204" cy="236" r="3" class="particle-3"/>
      <circle cx="308" cy="236" r="3" class="particle-3"/>
    </g>

    <!-- Left Hemisphere Lobes -->
    <g class="left-hemisphere">
      <path class="ia-lt lt-col" d="M 245,106 C 182,106 130,138 108,190 C 138,193 176,188 245,166 Z"/>
      <path class="ia-lm lm-col" d="M 103,206 C 88,244 89,280 101,304 C 142,295 186,281 245,250 L 245,182 C 182,204 138,208 103,206 Z"/>
      <path class="ia-lb lb-col" d="M 108,318 C 128,366 174,406 245,406 L 245,266 C 190,296 145,311 108,318 Z"/>
    </g>

    <!-- Right Hemisphere Lobes -->
    <g class="right-hemisphere">
      <path class="ia-rt lt-col" d="M 267,106 C 330,106 382,138 404,190 C 374,193 336,188 267,166 Z"/>
      <path class="ia-rm lm-col" d="M 409,206 C 424,244 423,280 411,304 C 370,295 326,281 267,250 L 267,182 C 330,204 374,208 409,206 Z"/>
      <path class="ia-rb lb-col" d="M 404,318 C 384,366 338,406 267,406 L 267,266 C 322,296 367,311 404,318 Z"/>
    </g>
  </g>
</svg>
