<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Inga Modern GitHub Social Preview (1280x640) - Balanced Descender Spacing -->
  <defs>
    <style>
      .bg-canvas { fill: #0F0F13; }
      .grid-pattern { stroke: #1D1D26; stroke-width: 1; }
      .card-surface { fill: #17171E; stroke: #262633; stroke-width: 1.5; }
      .brand-title { fill: #F4F4F5; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 124px; letter-spacing: -3.5px; }
      .brand-desc { fill: #818CF8; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 32px; letter-spacing: -0.3px; }
      .brand-spec { fill: #9494A0; font-family: Inter, system-ui, sans-serif; font-weight: 400; font-size: 21px; }
      .brand-pipeline { fill: #A5B4FC; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 18px; font-weight: 500; }
      .pill-bg { fill: #20202C; stroke: #313144; stroke-width: 1; }
      .pill-txt { fill: #D4D4D8; font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 16px; }
      .author { fill: #71717A; font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 19px; }
      .author-name { fill: #F4F4F5; font-weight: 600; }
    </style>
  </defs>

  <!-- Deep architectural dark background -->
  <rect width="1280" height="640" class="bg-canvas"/>

  <!-- Subtle precision grid (80px intervals) -->
  <g class="grid-pattern" opacity="0.35">
    <path d="M 0 80 L 1280 80 M 0 160 L 1280 160 M 0 240 L 1280 240 M 0 320 L 1280 320 M 0 400 L 1280 400 M 0 480 L 1280 480 M 0 560 L 1280 560"/>
    <path d="M 80 0 L 80 640 M 160 0 L 160 640 M 240 0 L 240 640 M 320 0 L 320 640 M 400 0 L 400 640 M 480 0 L 480 640 M 560 0 L 560 640 M 640 0 L 640 640 M 720 0 L 720 640 M 800 0 L 800 640 M 880 0 L 880 640 M 960 0 L 960 640 M 1040 0 L 1040 640 M 1120 0 L 1120 640 M 1200 0 L 1200 640"/>
  </g>

  <!-- Left: The Iconic Mark in dedicated raised card -->
  <g transform="translate(100, 140)">
    <rect width="360" height="360" rx="64" class="card-surface"/>
    <!-- Embedded precision brain (scaled from 512 to 280) -->
    <g transform="translate(40, 40) scale(0.546875)">
      <!-- Left Hemisphere -->
      <path d="M 245,106 C 182,106 130,138 108,190 C 138,193 176,188 245,166 Z" fill="#818CF8"/>
      <path d="M 103,206 C 88,244 89,280 101,304 C 142,295 186,281 245,250 L 245,182 C 182,204 138,208 103,206 Z" fill="#6366F1"/>
      <path d="M 108,318 C 128,366 174,406 245,406 L 245,266 C 190,296 145,311 108,318 Z" fill="#4F46E5"/>

      <!-- Right Hemisphere -->
      <path d="M 267,106 C 330,106 382,138 404,190 C 374,193 336,188 267,166 Z" fill="#818CF8"/>
      <path d="M 409,206 C 424,244 423,280 411,304 C 370,295 326,281 267,250 L 267,182 C 330,204 374,208 409,206 Z" fill="#6366F1"/>
      <path d="M 404,318 C 384,366 338,406 267,406 L 267,266 C 322,296 367,311 404,318 Z" fill="#4F46E5"/>
    </g>
  </g>

  <!-- Right: Project Typography & Tech Highlights -->
  <g transform="translate(520, 0)">
    <!-- Wordmark & Rust badge: Baseline raised to 206 (descender reaches y~238) -->
    <text x="0" y="206" class="brand-title">inga</text>
    <rect x="272" y="124" width="90" height="34" rx="17" fill="#2E2856" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="317" y="147" text-anchor="middle" fill="#C7D2FE" font-family="Inter, sans-serif" font-weight="600" font-size="18">Rust</text>

    <!-- Headline: Baseline at 284 (cap-height at y~260, leaving 22px clean breathing room below 'g') -->
    <text x="0" y="284" class="brand-desc">Local LLM inference in Rust</text>

    <!-- Subtitle specs -->
    <text x="0" y="332" class="brand-spec">One single executable · No runtime dependencies · Any model size</text>

    <!-- Memory Tier Pipeline Badge -->
    <g transform="translate(0, 372)">
      <rect width="520" height="42" rx="8" fill="#15151D" stroke="#2B2B3B" stroke-width="1"/>
      <text x="18" y="27" class="brand-pipeline">VRAM → RAM → Disk → Other Machines (Mesh)</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 444)">
      <rect x="0" y="0" width="124" height="34" rx="8" class="pill-bg"/>
      <text x="62" y="22" text-anchor="middle" class="pill-txt">Zero Config</text>

      <rect x="136" y="0" width="128" height="34" rx="8" class="pill-bg"/>
      <text x="200" y="22" text-anchor="middle" class="pill-txt">CPU + GPU</text>

      <rect x="276" y="0" width="120" height="34" rx="8" class="pill-bg"/>
      <text x="336" y="22" text-anchor="middle" class="pill-txt">OpenAPI</text>

      <rect x="408" y="0" width="150" height="34" rx="8" class="pill-bg"/>
      <text x="483" y="22" text-anchor="middle" class="pill-txt">WebUI Built-in</text>
    </g>

    <!-- Maintainer attribution -->
    <text x="0" y="534" class="author">Created by <tspan class="author-name">Matteo Baccan</tspan></text>
  </g>
</svg>
